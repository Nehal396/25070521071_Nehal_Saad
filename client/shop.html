<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop the collection — Atelier</title><link rel="stylesheet" href="css/style.css"></head><body><div data-header></div><main class="wrap"><header class="page-heading"><span class="eyebrow">Made for everyday</span><h1>Shop the collection</h1><p class="muted">Thoughtful objects, clothes, and essentials to live with.</p></header><div class="shop-layout"><aside class="filters"><h3>Refine your search</h3><div class="filter-grid"><label>Search<input class="field" id="filter-search" type="search" placeholder="What are you looking for?"></label><label>Category<select id="filter-category"><option value="">All categories</option></select></label><label>Minimum price<input class="field" id="filter-min" type="number" min="0" placeholder="$0"></label><label>Maximum price<input class="field" id="filter-max" type="number" min="0" placeholder="No limit"></label></div><label><input id="filter-stock" type="checkbox"> In stock only</label><br><button class="btn btn-light btn-small" id="clear-filters">Clear filters</button></aside><section><div class="shop-toolbar"><span id="results-count">Loading collection…</span><select id="sort-products" aria-label="Sort products"><option value="popular">Most loved</option><option value="newest">Newest</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select></div><div class="product-grid" id="shop-products"></div><div class="pagination" id="pagination"></div></section></div></main><div data-footer></div><script type="module" src="js/main.js"></script></body></html>
